[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "public-economic-policy-advisor"
version = "1.0.0"
description = "Evidence-based fiscal, monetary, and welfare policy analysis skill with a modular skill-registry + chain-of-thought router architecture."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Public Economic Policy Advisor Contributors" }]
keywords = ["public-economics", "policy-analysis", "tax-incidence", "cost-benefit", "causal-inference", "claude-skill", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pepa = "policy_advisor.__main__:main"

[tool.setuptools]
packages = ["config", "policy_advisor", "policy_advisor.hooks", "policy_advisor.tools", "policy_advisor.sub_advisors", "policy_advisor.utils", "policy_advisor.utils.adapters", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
